{%- comment -%}
Links to the previous (older) and next (newer) post in the same category:
site.posts for regular posts, site.photography for photography posts.
{%- endcomment -%}
<nav class="d-flex justify-content-between mt-4 mb-2" markdown="0">
    <div>{% if page.previous %}<a href="{{ page.previous.url }}">&laquo; {{ page.previous.title }}</a>{% endif %}</div>
    <div class="text-right">{% if page.next %}<a href="{{ page.next.url }}">{{ page.next.title }} &raquo;</a>{% endif %}</div>
</nav>
